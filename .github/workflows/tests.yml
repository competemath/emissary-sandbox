name: tests
on:
  push:
    paths: ["judge/**", "canary/expected.json", ".github/workflows/**"]
  pull_request:
    paths: ["judge/**", "canary/expected.json", ".github/workflows/**"]
permissions: {}
jobs:
  judge:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - run: python3 -m unittest discover -s judge/tests
